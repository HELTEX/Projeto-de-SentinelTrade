spring:
  application:
    name: sentineltrade-backend
  config:
    import:
      # Le o .env da raiz do projeto (rodando de backend/ ou da raiz). Nada de segredo aqui.
      - optional:file:../.env[.properties]
      - optional:file:./.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sentineltrade}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none        # o schema e criado por database/schema.sql
    open-in-view: false

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
